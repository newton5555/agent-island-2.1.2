name: Listing or integration request
description: Suggest an awesome list, directory, or integration where Agent Island belongs.
title: "[Listing]: "
labels: ["growth", "documentation"]
body:
  - type: input
    id: target
    attributes:
      label: Target list, directory, or integration
      placeholder: https://github.com/example/awesome-...
    validations:
      required: true
  - type: textarea
    id: fit
    attributes:
      label: Why is Agent Island a fit?
      placeholder: This list accepts macOS developer tools for Claude Code...
    validations:
      required: true
  - type: textarea
    id: suggested-copy
    attributes:
      label: Suggested listing copy
      placeholder: Agent Island - native macOS status companion for Claude Code and Codex...
  - type: checkboxes
    id: rules
    attributes:
      label: Submission rules checked
      options:
        - label: I checked that the target accepts project submissions.
        - label: I checked whether a pull request, issue, or form is required.
