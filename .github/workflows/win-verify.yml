# Verification-only: renders every Windows surface to PNGs on a real
# Windows runner so the port can be eyeballed without a hand install.
# Never packages, never releases — release stays tag-driven.
name: win-verify

on:
  push:
    branches: [win-verify]
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: dotnet build windows/src/AgentIsland/AgentIsland.csproj -c Release -p:EnableWindowsTargeting=true

      - name: Snapshot sweep (zh)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse windows/src/AgentIsland/bin/Release -Filter AgentIsland.exe | Select-Object -First 1
          $env:AGENTISLAND_DEMO = "1"
          $env:AGENTISLAND_LANG = "zh"
          $env:AGENTISLAND_SNAPSHOT_DIR = "$env:GITHUB_WORKSPACE\shots\zh"
          Start-Process -Wait -FilePath $exe.FullName

      - name: Snapshot sweep (en)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse windows/src/AgentIsland/bin/Release -Filter AgentIsland.exe | Select-Object -First 1
          $env:AGENTISLAND_DEMO = "1"
          $env:AGENTISLAND_LANG = "en"
          $env:AGENTISLAND_SNAPSHOT_DIR = "$env:GITHUB_WORKSPACE\shots\en"
          Start-Process -Wait -FilePath $exe.FullName

      - name: Snapshot sweep (antigravity + grok island)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse windows/src/AgentIsland/bin/Release -Filter AgentIsland.exe | Select-Object -First 1
          $env:AGENTISLAND_DEMO = "1"
          $env:AGENTISLAND_DEMO_GUESTS = "1"
          $env:AGENTISLAND_LANG = "zh"
          $env:AGENTISLAND_DEMO_PROVIDERS = "antigravity,grok"
          $env:AGENTISLAND_SNAPSHOT_DIR = "$env:GITHUB_WORKSPACE\shots\guests-ag"
          Start-Process -Wait -FilePath $exe.FullName

      - name: Snapshot sweep (claude + cursor island)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse windows/src/AgentIsland/bin/Release -Filter AgentIsland.exe | Select-Object -First 1
          $env:AGENTISLAND_DEMO = "1"
          $env:AGENTISLAND_DEMO_GUESTS = "1"
          $env:AGENTISLAND_LANG = "zh"
          $env:AGENTISLAND_DEMO_PROVIDERS = "claude,cursor"
          $env:AGENTISLAND_SNAPSHOT_DIR = "$env:GITHUB_WORKSPACE\shots\guests-cursor"
          Start-Process -Wait -FilePath $exe.FullName

      - name: Snapshot sweep (stale-log repro, real scan)
        shell: pwsh
        run: |
          # Reproduce the owner's field bug: a machine whose CLI logs stopped
          # weeks ago. Synthetic-but-real-format Claude transcript, demo OFF,
          # so the report card assembles from an actual log scan.
          $dir = "$env:USERPROFILE\.claude\projects\stale-repro"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $lines = @()
          $i = 0
          foreach ($d in 18..24) {
            foreach ($h in 9, 14, 20) {
              $i++
              $ts = "2026-07-{0:d2}T{1:d2}:15:00.000Z" -f $d, $h
              $model = if ($i % 2 -eq 0) { "claude-fable-5" } else { "claude-opus-4-8" }
              $lines += '{"type":"assistant","timestamp":"' + $ts + '","requestId":"req-' + $i + '","message":{"id":"msg-' + $i + '","model":"' + $model + '","usage":{"input_tokens":120000,"output_tokens":80000,"cache_creation_input_tokens":300000,"cache_read_input_tokens":700000}}}'
            }
          }
          Set-Content -Path "$dir\session.jsonl" -Value ($lines -join "`n") -Encoding utf8
          $exe = Get-ChildItem -Recurse windows/src/AgentIsland/bin/Release -Filter AgentIsland.exe | Select-Object -First 1
          $env:AGENTISLAND_LANG = "zh"
          $env:AGENTISLAND_SNAPSHOT_DIR = "$env:GITHUB_WORKSPACE\shots\stale"
          Start-Process -Wait -FilePath $exe.FullName

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shots
